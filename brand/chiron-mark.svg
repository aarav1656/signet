<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#121315"/>
  <g transform="translate(512 512) scale(1.151) translate(-515.0 -353.0)">
  <!-- the attested key: a TDX chip on the gate post -->
  <rect x="540" y="106" width="120" height="88" rx="6" fill="none" stroke="#f2b134" stroke-width="12"/>
  <line x1="570" y1="82" x2="570" y2="100" stroke="#f2b134" stroke-width="8"/>
  <line x1="570" y1="200" x2="570" y2="218" stroke="#f2b134" stroke-width="8"/>
  <line x1="600" y1="82" x2="600" y2="100" stroke="#f2b134" stroke-width="8"/>
  <line x1="630" y1="82" x2="630" y2="100" stroke="#f2b134" stroke-width="8"/>
  <line x1="630" y1="200" x2="630" y2="218" stroke="#f2b134" stroke-width="8"/>
  <line x1="516" y1="126" x2="534" y2="126" stroke="#f2b134" stroke-width="8"/>
  <line x1="666" y1="126" x2="684" y2="126" stroke="#f2b134" stroke-width="8"/>
  <line x1="516" y1="150" x2="534" y2="150" stroke="#f2b134" stroke-width="8"/>
  <line x1="666" y1="150" x2="684" y2="150" stroke="#f2b134" stroke-width="8"/>
  <line x1="516" y1="174" x2="534" y2="174" stroke="#f2b134" stroke-width="8"/>
  <line x1="666" y1="174" x2="684" y2="174" stroke="#f2b134" stroke-width="8"/>
  <!-- the gate: the owner's cap -->
  <line x1="600" y1="194" x2="600" y2="620" stroke="#e9e7e2" stroke-width="12"/>
  <!-- in-cap trades pass and end in a receipt -->
  <line x1="150" y1="290" x2="830" y2="290" stroke="#f2b134" stroke-width="20" stroke-linecap="round"/>
  <circle cx="850" cy="290" r="30" fill="#f2b134"/>
  <line x1="150" y1="540" x2="730" y2="540" stroke="#f2b134" stroke-width="20" stroke-linecap="round"/>
  <circle cx="750" cy="540" r="30" fill="#f2b134"/>
  <!-- the oversize trade stops at the gate -->
  <line x1="172" y1="415" x2="560" y2="415" stroke="#ef5a4c" stroke-width="44" stroke-linecap="round"/>
  </g>
