# Defaults plus one scoped allowlist: web/lib/track-record.json is generated by scripts/track-record.ts
# from public chain data. Its tokenIn/tokenOut fields hold public token addresses that the
# generic-api-key rule reads as keys. Nothing else is allowlisted.
[extend]
useDefault = true

[allowlist]
description = "generated public chain data"
paths = ['''web/lib/track-record\.json''']
