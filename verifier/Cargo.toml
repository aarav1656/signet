[package]
name = "assay-verify"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
stylus-sdk = "0.10.9"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
ecdsa = { version = "0.17", default-features = false }
sha2 = { version = "0.10", default-features = false }
signature = { version = "3.0", default-features = false }

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
contract-client-gen = []

[dev-dependencies]
stylus-sdk = { version = "0.10.9", features = ["stylus-test"] }
hex = "0.4"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
